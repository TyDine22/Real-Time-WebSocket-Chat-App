<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Chat Application</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d0d0f;
            --surface: #16161a;
            --surface2: #1e1e24;
            --border: rgba(255,255,255,0.07);
            --accent: #7b61ff;
            --accent2: #ff6b6b;
            --accent-edit: #f59e0b;
            --accent-delete: #ef4444;
            --text: #f0f0f4;
            --muted: #6b6b7a;
            --muted2: #3e3e4e;
            --bubble-out: #7b61ff;
            --bubble-in: #1e1e24;
            --green: #4ade80;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-family: 'DM Sans', sans-serif;
            color: var(--text); padding: 1rem;
            background-image:
                    radial-gradient(ellipse 60% 50% at 80% 10%, rgba(123,97,255,0.12) 0%, transparent 60%),
                    radial-gradient(ellipse 50% 40% at 20% 90%, rgba(255,107,107,0.08) 0%, transparent 60%);
        }

        .chat-shell {
            width: 100%; max-width: 520px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 0 0 1px rgba(123,97,255,0.08), 0 40px 80px rgba(0,0,0,0.6), 0 8px 24px rgba(0,0,0,0.4);
            animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 14px;
            background: rgba(255,255,255,0.02);
        }

        .avatar-ring {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px;
            flex-shrink: 0;
            box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px rgba(123,97,255,0.4);
        }

        .chat-header-info h2 {
            font-family: 'Syne', sans-serif;
            font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
        }

        .status-dot {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; color: var(--muted); margin-top: 2px;
        }
        .status-dot::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: var(--green); box-shadow: 0 0 6px var(--green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* ── Messages ── */
        #chat {
            flex: 1; min-height: 340px; max-height: 420px;
            overflow-y: auto;
            padding: 20px 20px 12px;
            display: flex; flex-direction: column; gap: 2px;
            scroll-behavior: smooth;
        }
        #chat::-webkit-scrollbar { width: 4px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .message-row {
            display: flex; flex-direction: column; align-items: flex-start;
            animation: msgIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
            margin-top: 10px;
        }
        .message-row.self { align-items: flex-end; }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg-sender {
            font-size: 10px; font-weight: 500; color: var(--muted);
            margin-bottom: 4px; padding: 0 4px;
            letter-spacing: 0.4px; text-transform: uppercase;
        }

        /* Bubble + toolbar side by side */
        .bubble-wrap {
            display: flex; align-items: flex-end; gap: 5px; max-width: 85%;
        }
        .message-row.self .bubble-wrap { flex-direction: row-reverse; }

        .msg-bubble {
            padding: 10px 14px; border-radius: 18px;
            font-size: 14px; line-height: 1.55;
            word-break: break-word; color: var(--text);
            background: var(--bubble-in); border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .message-row.self .msg-bubble {
            background: var(--bubble-out); border-color: transparent;
            border-bottom-right-radius: 4px; border-bottom-left-radius: 18px;
            box-shadow: 0 4px 16px rgba(123,97,255,0.3);
        }

        /* Icon toolbar */
        .msg-toolbar {
            display: flex; flex-direction: column; gap: 3px;
            opacity: 0; pointer-events: none;
            transform: scale(0.75);
            transition: opacity 0.18s, transform 0.18s;
        }
        .message-row.self:hover .msg-toolbar {
            opacity: 1; pointer-events: all; transform: scale(1);
        }

        .tool-btn {
            width: 26px; height: 26px; border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface2);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }
        .tool-btn svg { width: 12px; height: 12px; }

        .tool-btn.edit { color: var(--accent-edit); }
        .tool-btn.edit:hover {
            background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.4);
            transform: scale(1.12);
        }
        .tool-btn.del { color: var(--accent-delete); }
        .tool-btn.del:hover {
            background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4);
            transform: scale(1.12);
        }

        /* Meta: time + edited */
        .msg-meta {
            display: flex; align-items: center; gap: 5px;
            margin-top: 4px; padding: 0 4px;
        }
        .message-row.self .msg-meta { flex-direction: row-reverse; }

        .msg-time {
            font-size: 10px; color: var(--muted2);
            font-variant-numeric: tabular-nums;
        }

        .edited-badge {
            display: none; align-items: center; gap: 3px;
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.22);
            border-radius: 5px; padding: 1px 5px;
            font-size: 9px; color: var(--accent-edit);
            font-weight: 600; letter-spacing: 0.3px;
            text-transform: uppercase; cursor: default;
        }
        .edited-badge.visible { display: flex; }
        .edited-badge svg { width: 8px; height: 8px; }

        .empty-state {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 8px; color: var(--muted); font-size: 13px; padding: 40px 0;
        }
        .empty-icon { font-size: 32px; }

        /* ── Footer ── */
        .chat-footer {
            padding: 14px 18px;
            border-top: 1px solid var(--border);
            background: rgba(255,255,255,0.015);
            display: flex; flex-direction: column; gap: 10px;
        }

        /* Edit banner */
        .edit-banner {
            display: none; align-items: center; gap: 8px;
            background: rgba(245,158,11,0.07);
            border: 1px solid rgba(245,158,11,0.2);
            border-radius: 10px; padding: 7px 12px;
            font-size: 12px; color: var(--accent-edit);
        }
        .edit-banner.active { display: flex; }
        .edit-banner svg { width: 12px; height: 12px; flex-shrink: 0; }
        .edit-banner-text { flex: 1; }
        .cancel-edit-btn {
            background: transparent; border: none; color: var(--muted);
            cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px;
            transition: color 0.15s;
        }
        .cancel-edit-btn:hover { color: var(--accent-delete); }

        .field-row { display: flex; align-items: center; gap: 8px; }

        input[type="text"] {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 12px; padding: 10px 14px;
            font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
            outline: none; transition: border-color 0.2s, box-shadow 0.2s; width: 100%;
        }
        input[type="text"]::placeholder { color: var(--muted); }
        input[type="text"]:focus {
            border-color: rgba(123,97,255,0.5);
            box-shadow: 0 0 0 3px rgba(123,97,255,0.12);
        }
        #senderInput { width: 130px; flex-shrink: 0; }

        #sendBtn {
            background: var(--accent); border: none; border-radius: 12px;
            padding: 10px 16px; color: #fff;
            font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
            cursor: pointer; white-space: nowrap; flex-shrink: 0;
            display: flex; align-items: center; gap: 6px;
            transition: filter 0.2s, transform 0.15s, box-shadow 0.2s, background 0.2s;
            box-shadow: 0 4px 14px rgba(123,97,255,0.35);
        }
        #sendBtn.editing {
            background: var(--accent-edit);
            box-shadow: 0 4px 14px rgba(245,158,11,0.35);
        }
        #sendBtn:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
        #sendBtn:active:not(:disabled) { transform: translateY(0); }
        #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

        .conn-badge {
            text-align: center; font-size: 10px; color: var(--muted);
            letter-spacing: 0.5px; text-transform: uppercase; padding-top: 2px;
        }
    </style>
</head>
<body>
<div class="chat-shell">
    <div class="chat-header">
        <div class="avatar-ring">RT</div>
        <div class="chat-header-info">
            <h2>Live Chat</h2>
            <div class="status-dot">Connected · Real-time</div>
        </div>
    </div>

    <div id="chat">
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">💬</div>
            <span>No messages yet — say hello!</span>
        </div>
    </div>

    <div class="chat-footer">
        <div class="edit-banner" id="editBanner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <span class="edit-banner-text">Editing message — press <strong>Esc</strong> to cancel</span>
            <button class="cancel-edit-btn" id="cancelEditBtn" title="Cancel">✕</button>
        </div>

        <div class="field-row">
            <input id="senderInput" type="text" placeholder="Your name…" />
            <input id="messageInput" type="text" placeholder="Type a message…" style="flex:1" />
            <button id="sendBtn" disabled>
                <span id="btnIcon">↑</span> <span id="btnLabel">Send</span>
            </button>
        </div>
        <div class="conn-badge" id="connBadge">Connecting…</div>
    </div>
</div>

<script>
    let stompClient = null;
    let myName = localStorage.getItem('chat_username') || '';
    let editingId = null;

    function formatTime(date) {
        if (!date || isNaN(date.getTime())) return 'Just now';
        return date.toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit',
            hour12: true,
        });
    }

    function setConnected(connected) {
        document.getElementById('sendBtn').disabled = !connected;
        document.getElementById('connBadge').textContent = connected
            ? 'End-to-end · Encrypted channel' : 'Disconnected';
        if (myName) document.getElementById('senderInput').value = myName;
    }

    function connect() {
        myName = localStorage.getItem('chat_username') || '';
        if (myName) document.getElementById('senderInput').value = myName;

        fetch('/chat/history')
            .then(r => r.json())
            .then(msgs => msgs.forEach(showMessage))
            .catch(() => {});

        const socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({}, function () {
            setConnected(true);
            stompClient.subscribe('/topic/messages', function (payload) {
                const data = JSON.parse(payload.body);
                if (data.deleteId) {
                    const el = document.querySelector(`[data-id="${data.deleteId}"]`);
                    if (el) {
                        el.style.opacity = '0';
                        el.style.transform = 'scale(0.9)';
                        el.style.transition = '0.2s ease';
                        setTimeout(() => {
                            el.remove();
                            if (!document.querySelector('.message-row')) location.reload();
                        }, 200);
                    }
                } else {
                    showMessage(data);
                }
            });
        }, function () { setConnected(false); });
    }

    function showMessage(message) {
        const chat = document.getElementById('chat');
        const existingRow = document.querySelector(`[data-id="${message.id}"]`);

        // --- LOGIC FOR UPDATING EXISTING MESSAGE (EDIT) ---
        if (existingRow) {
            // Update content
            existingRow.querySelector('.msg-bubble').textContent = message.content;

            // Update Meta/Badge
            const badge = existingRow.querySelector('.edited-badge');
            if (badge && message.editedAt) {
                // Ensure the badge is shown
                badge.classList.add('visible');

                // Force a fresh Date object from the editedAt string
                const editTime = new Date(message.editedAt);

                // Update the hover tooltip with the new time
                badge.title = `Edited at ${formatTime(editTime)}`;

                // Add a small visual feedback (optional)
                existingRow.style.animation = 'none';
                existingRow.offsetHeight; // trigger reflow
                existingRow.style.animation = 'msgIn 0.28s ease';
            }
            return;
        }

        const emptyState = document.getElementById('emptyState');
        if (emptyState) emptyState.remove();

        const isSelf = message.sender === myName;

        // FIX: Map 'timestamp' from Java model
        const sentAt  = new Date(message.timestamp);
        const editedAt = message.editedAt ? new Date(message.editedAt) : null;

        const row = document.createElement('div');
        row.className = 'message-row' + (isSelf ? ' self' : '');
        row.setAttribute('data-id', message.id);

        // --- RE-ADDED: SENDER LABEL LOGIC ---
        if (!isSelf) {
            const senderLabel = document.createElement('div');
            senderLabel.className = 'msg-sender';
            senderLabel.textContent = message.sender;
            row.appendChild(senderLabel);
        }

        // --- RE-ADDED: BUBBLE & TOOLBAR LOGIC ---
        const wrap = document.createElement('div');
        wrap.className = 'bubble-wrap';

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = message.content;
        wrap.appendChild(bubble);

        if (isSelf) {
            const toolbar = document.createElement('div');
            toolbar.className = 'msg-toolbar';

            toolbar.innerHTML = `
            <button class="tool-btn edit" title="Edit" onclick="prepareEdit('${message.id}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="tool-btn del" title="Delete" onclick="deleteMsg('${message.id}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
        `;
            wrap.appendChild(toolbar);
        }

        row.appendChild(wrap);

        // --- META: TIME + EDITED ---
        const meta = document.createElement('div');
        meta.className = 'msg-meta';

        const timeEl = document.createElement('span');
        timeEl.className = 'msg-time';
        timeEl.textContent = formatTime(sentAt);
        meta.appendChild(timeEl);

        const badge = document.createElement('span');
        badge.className = 'edited-badge' + (editedAt ? ' visible' : '');
        badge.title = editedAt ? `Edited at ${formatTime(editedAt)}` : '';
        badge.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> edited`;
        meta.appendChild(badge);

        row.appendChild(meta);
        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
    }

    function prepareEdit(id) {
        editingId = id;
        const row = document.querySelector(`[data-id="${id}"]`);
        if (!row) return;

        const input = document.getElementById('messageInput');
        input.value = row.querySelector('.msg-bubble').textContent;
        input.focus();

        document.getElementById('editBanner').classList.add('active');
        document.getElementById('sendBtn').classList.add('editing');
        document.getElementById('btnIcon').textContent = '✓';
        document.getElementById('btnLabel').textContent = 'Update';
    }

    function cancelEdit() {
        editingId = null;
        document.getElementById('messageInput').value = '';
        document.getElementById('editBanner').classList.remove('active');
        document.getElementById('sendBtn').classList.remove('editing');
        document.getElementById('btnIcon').textContent = '↑';
        document.getElementById('btnLabel').textContent = 'Send';
    }

    document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);

    function deleteMsg(id) {
        if (confirm('Delete this message?')) {
            stompClient.send('/app/deleteMessage', {}, JSON.stringify({ id, sender: myName }));
        }
    }

    function sendMessage() {
        const sender = document.getElementById('senderInput').value.trim();
        const content = document.getElementById('messageInput').value.trim();
        if (!sender || !content || !stompClient) return;

        myName = sender;

        if (editingId) {
            stompClient.send('/app/editMessage', {}, JSON.stringify({ id: editingId, sender, content }));
            cancelEdit();
        } else {
            stompClient.send('/app/sendMessage', {}, JSON.stringify({ sender, content }));
            document.getElementById('messageInput').value = '';
        }
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        if (e.key === 'Escape' && editingId) cancelEdit();
    });

    window.onload = connect;
</script>
</body>
</html>
